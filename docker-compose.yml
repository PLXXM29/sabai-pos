# Local development: Postgres plus the full app image.
#
#   cp .env.example .env
#   docker compose up -d --build
#   → http://localhost:8082  (demo data is generated on first boot)
#
# The app migrates its own schema and seeds itself, so there is no separate
# migrate or seed step to remember. Working on the frontend? Run the Vite dev
# server instead (`cd frontend && npm run dev`) — it proxies /api to :8082, so
# HMR and the real API coexist.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # host 5433 → container 5432 (avoids clashing with a local Postgres on 5432)
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_PORT: "8080"
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Fills an empty database with a month of sample trading so every screen
      # has something to show on the first run.
      DEMO_MODE: ${DEMO_MODE:-true}
      # No scheduled wipe locally — a developer's test data should survive.
      DEMO_RESET_EVERY: "0"
      PAYMENT_NOTIFY_SECRET: ${PAYMENT_NOTIFY_SECRET:-}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      LINE_AMOUNT_REGEX: ${LINE_AMOUNT_REGEX:-}
    ports:
      # host 8082 → container 8080 (8080/8081 are taken by other services here)
      - "8082:8080"

volumes:
  pgdata:
