# Self-hosted production stack: the app container and its database, nothing else.
#
#   cp .env.example .env      # APP_ENV=production + STRONG secrets
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml run --rm --entrypoint /seed app
#
# The app serves the UI and the API on one port and migrates its own schema, so
# there is no nginx tier and no migrate job here. Put a TLS-terminating proxy in
# front of it (Caddy is two lines — see docs/deploy.md): the refresh cookie is
# Secure in production and will not travel over plain HTTP.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      args:
        VERSION: ${APP_VERSION:-selfhosted}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      HTTP_PORT: "8080"
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # A real shop is never a demo: no published logins, no reset endpoint.
      DEMO_MODE: "false"
      PAYMENT_NOTIFY_SECRET: ${PAYMENT_NOTIFY_SECRET:-}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      LINE_AMOUNT_REGEX: ${LINE_AMOUNT_REGEX:-}
    ports:
      - "${WEB_PORT:-8090}:8080"

volumes:
  pgdata:
